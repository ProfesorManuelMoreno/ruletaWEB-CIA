<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruleta de alumnado</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#202124;--muted:#667085;--border:#d7dce2;--blue:#1769aa;--blue2:#0f568e}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
main{max-width:1050px;margin:auto;padding:24px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:34px}.sub{color:var(--muted);margin-top:5px}
button{min-height:44px;border-radius:9px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}
.primary{border:0;background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}
.secondary{border:1px solid #bcc4ce;background:#fff;color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:18px}
textarea{width:100%;min-height:250px;padding:12px;border:1px solid #bcc4ce;border-radius:9px;font:inherit;font-size:16px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}.status{color:var(--muted);font-size:14px;margin-top:10px}
.wheel{width:min(340px,80vw);aspect-ratio:1;margin:2px auto 16px;border-radius:50%;border:11px solid #dfe5ec;display:flex;align-items:center;justify-content:center;position:relative;background:conic-gradient(#d9e9fb 0 45deg,#f7f9fb 45deg 90deg,#e8eef6 90deg 135deg,#f7f9fb 135deg 180deg,#d9e9fb 180deg 225deg,#f7f9fb 225deg 270deg,#e8eef6 270deg 315deg,#f7f9fb 315deg 360deg)}
.pointer{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--blue);z-index:3}
.result{position:relative;z-index:2;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:14px;padding:20px;min-width:68%;text-align:center}.label{font-size:14px;color:var(--muted)}#winner{font-size:38px;font-weight:800;margin-top:7px;word-break:break-word}
.spin{width:100%;font-size:19px;padding:14px}
.history{margin-top:18px}.history-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:8px}
.history h2{margin:0;font-size:22px}ol{margin:0;padding-left:34px}li{padding:9px 6px;border-bottom:1px solid #edf0f3;font-size:16px}li:last-child{border-bottom:0}.empty{color:var(--muted);font-size:14px}
.tip{margin-top:14px;padding:11px 13px;background:#eef6ff;border-left:4px solid var(--blue);border-radius:7px;font-size:14px;line-height:1.45}
@media(max-width:760px){main{padding:14px}.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Ruleta de alumnado</h1><div class="sub">Puesta en común y microdemostraciones</div></div>
  <button id="sound" class="secondary" type="button">🔊 Sonido</button>
</header>

<div class="grid">
<section class="card">
<label for="names"><strong>Lista del alumnado</strong></label>
<textarea id="names" placeholder="Escribe o pega un nombre por línea"></textarea>
<div class="actions">
<button id="load" class="primary" type="button">Cargar / actualizar lista</button>
<button id="restart" class="secondary" type="button">Reiniciar sorteo</button>
<button id="clear" class="secondary" type="button">Borrar lista</button>
</div>
<div id="status" class="status">No hay alumnado cargado.</div>
<div class="tip">Los seleccionados quedan guardados en este navegador. <strong>Reiniciar sorteo</strong> conserva el grupo pero permite que vuelvan a salir. <strong>Borrar lista</strong> elimina todo.</div>
</section>

<section class="card">
<div id="wheel" class="wheel"><div class="pointer"></div><div class="result"><div class="label">Seleccionado/a</div><div id="winner">—</div></div></div>
<button id="spin" class="primary spin" type="button">🎲 Sortear</button>
</section>
</div>

<section class="card history">
<div class="history-head"><h2>Ya han salido</h2><strong id="counter">0 / 0</strong></div>
<div id="history"><span class="empty">Todavía nadie.</span></div>
</section>
</main>

<script>
(function(){
const KEY='ruleta_alumnado_independiente_v1', SOUND='ruleta_alumnado_sonido_v1';
const names=document.getElementById('names'), load=document.getElementById('load'), restart=document.getElementById('restart'),
clear=document.getElementById('clear'), spin=document.getElementById('spin'), sound=document.getElementById('sound'),
winner=document.getElementById('winner'), status=document.getElementById('status'), history=document.getElementById('history'),
counter=document.getElementById('counter'), wheel=document.getElementById('wheel');
let data={all:[],remaining:[],used:[],last:''}, soundOn=localStorage.getItem(SOUND)!=='0', busy=false, angle=0, ctx=null;

function parse(v){const seen=new Set();return v.split(/\r?\n|,/).map(x=>x.trim()).filter(x=>x&&!seen.has(x)&&seen.add(x)).slice(0,300)}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function restore(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.all)&&Array.isArray(d.remaining)&&Array.isArray(d.used)){data=d;names.value=d.all.join('\n')}}catch(e){}}
function render(){
 winner.textContent=data.last||'—'; status.textContent=data.all.length?`${data.remaining.length} disponibles de ${data.all.length}`:'No hay alumnado cargado.';
 counter.textContent=`${data.used.length} / ${data.all.length}`; spin.disabled=busy||!data.remaining.length; spin.style.opacity=spin.disabled?'.45':'1';
 load.disabled=restart.disabled=clear.disabled=busy; history.innerHTML='';
 if(!data.used.length){history.innerHTML='<span class="empty">Todavía nadie.</span>'}
 else{const ol=document.createElement('ol');data.used.forEach(n=>{const li=document.createElement('li');li.textContent=n;ol.appendChild(li)});history.appendChild(ol)}
 sound.textContent=soundOn?'🔊 Sonido':'🔇 Silencio';
}
function audio(){if(!soundOn)return null;try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}}
function beep(f,d,v,delay=0){const c=audio();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02)}
load.onclick=()=>{const a=parse(names.value);data={all:[...a],remaining:[...a],used:[],last:''};save();render()};
restart.onclick=()=>{data.remaining=[...data.all];data.used=[];data.last='';save();render()};
clear.onclick=()=>{data={all:[],remaining:[],used:[],last:''};names.value='';save();render()};
sound.onclick=()=>{soundOn=!soundOn;localStorage.setItem(SOUND,soundOn?'1':'0');render();if(soundOn)beep(740,.09,.035)};
spin.onclick=()=>{
 if(busy||!data.remaining.length)return;busy=true;winner.textContent='...';render();audio();
 const idx=Math.floor(Math.random()*data.remaining.length), chosen=data.remaining[idx], start=performance.now(), duration=2600, from=angle, to=from+(5+Math.floor(Math.random()*3))*360+60+Math.random()*240;let tick=0;
 function frame(now){const t=Math.min(1,(now-start)/duration),e=1-Math.pow(1-t,3),a=from+(to-from)*e;wheel.style.transform=`rotate(${a}deg)`;
 if(now-tick>65+t*190){beep(520,.045,.035);tick=now}
 if(t<1)requestAnimationFrame(frame);else{angle=to%360;data.remaining.splice(idx,1);data.used.push(chosen);data.last=chosen;save();busy=false;beep(660,.14,.055);beep(880,.18,.05,.11);render()}}
 requestAnimationFrame(frame);
};
restore();render();
})();
</script>
</body>
</html>
